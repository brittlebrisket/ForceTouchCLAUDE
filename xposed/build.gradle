plugins {
    id 'com.android.application'
}

android {
    namespace 'jp.tkgktyk.xposed.forcetouchdetector'
    compileSdk 34

    defaultConfig {
        applicationId 'jp.tkgktyk.xposed.forcetouchdetector'
        minSdk 26
        // 34, not 35: Android 15 forces edge-to-edge on apps targeting 35, which would
        // put the 2016 settings screens under the status bar.
        targetSdk 34
        versionCode 31
        versionName '0.6.0-android15'
    }

    signingConfigs {
        // Fixed key committed to the repo so every CI build can update the last one in place.
        // This is a personal-use key, not a secret.
        ftd {
            storeFile rootProject.file('signing/ftd.jks')
            storePassword 'forcetouch'
            keyAlias 'ftd'
            keyPassword 'forcetouch'
        }
    }

    buildTypes {
        release {
            // No shrinking: Xposed entry points, ButterKnife binders and Gson models are all
            // reached by reflection.
            minifyEnabled false
            signingConfig signingConfigs.ftd
        }
        debug {
            signingConfig signingConfigs.ftd
        }
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    compileOnly 'de.robv.android.xposed:api:82'

    implementation project(':lib')
    implementation 'com.jakewharton:butterknife:7.0.1'
    annotationProcessor 'com.jakewharton:butterknife:7.0.1'
    implementation 'com.android.support:design:28.0.0'
    implementation 'com.android.support:recyclerview-v7:28.0.0'
    implementation 'com.android.support:cardview-v7:28.0.0'
    implementation 'com.google.code.gson:gson:2.4'
}
