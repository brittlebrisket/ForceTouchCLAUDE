name: Build APK

on:
  push:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Build
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew --no-daemon --stacktrace :xposed:assembleRelease 2>&1 | tee build.log

      - name: Publish APK as a GitHub release
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp xposed/build/outputs/apk/release/xposed-release.apk ForceTouch-android15.apk
          gh release create "build-${{ github.run_number }}" ForceTouch-android15.apk \
            --target "${{ github.sha }}" \
            --title "ForceTouch for Android 15 (build ${{ github.run_number }})" \
            --notes "Built from ${{ github.sha }}. Install the APK, enable the module in LSPosed, add System Framework plus the apps you want, then reboot." \
            --latest

      # Keeps the latest build log on a 'ci-logs' branch so it can be read without the Actions UI.
      - name: Save build log
        if: always()
        run: |
          mkdir -p /tmp/logrepo && cd /tmp/logrepo
          git init -q
          cp "$GITHUB_WORKSPACE/build.log" . 2>/dev/null || echo "no build log" > build.log
          echo "run ${{ github.run_number }} sha ${{ github.sha }} status ${{ job.status }}" > status.txt
          git add .
          git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -qm "Build log for run ${{ github.run_number }}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" HEAD:ci-logs
