org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
# The 2016 code uses the old Android Support Library (28.0.0, the last release), not AndroidX.
android.useAndroidX=false
# Keep 2016 behaviour: one merged R class and constant resource IDs (ButterKnife 7 needs constants).
android.nonTransitiveRClass=false
android.nonFinalResIds=false
android.suppressUnsupportedCompileSdk=34
